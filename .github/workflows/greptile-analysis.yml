name: Greptile Code Analysis

on:
  push:
    branches: [ main, dev, dev-optimized-eink ]
  pull_request:
    branches: [ main ]

jobs:
  greptile-analysis:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install requests
        
    - name: Debug environment
      run: |
        echo "=== ENVIRONMENT DEBUG ==="
        echo "GREPTILE_API_TOKEN set: ${GREPTILE_API_TOKEN:+yes}"
        echo "GREPTILE_API_TOKEN length: ${GREPTILE_API_TOKEN:+${#GREPTILE_API_TOKEN}}"
        echo "Repository: ${{ github.repository }}"
        echo "Commit SHA: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "========================"
        
    - name: Run Greptile Analysis
      env:
        GREPTILE_API_TOKEN: ${{ secrets.GREPTILE_API_TOKEN }}
      run: |
        echo "=== STARTING GREPTILE ANALYSIS ==="
        
        # Create comprehensive analysis request
        cat > analysis_request.json << 'EOF_JSON'
{
  "repository": "${{ github.repository }}",
  "commit": "${{ github.sha }}",
  "branch": "${{ github.ref_name }}",
  "analysis": {
    "targets": [
      "firmware/CollectorDeviceFirmware/CollectorDeviceFirmware.ino",
      "firmware/LineDeviceFirmware/LineDeviceFirmware.ino",
      "firmware/TuggerDeviceFirmware/TuggerFirmware.ino",
      "firmware/test-greptile-features.ino"
    ],
    "rules": [
      "memory_leaks",
      "buffer_overflows", 
      "race_conditions",
      "null_pointer_dereference",
      "infinite_loops",
      "performance_issues"
    ]
  }
}
EOF_JSON
        
        echo "=== ANALYSIS REQUEST CREATED ==="
        cat analysis_request.json
        
        # Check if API token is available
        if [ -z "$GREPTILE_API_TOKEN" ]; then
          echo "❌ GREPTILE_API_TOKEN not found"
          echo "Creating local fallback analysis..."
          
          # Run local analysis
          python3 -c "
import json
import os
import re

# Create local analysis report
report = {
    'analysis_type': 'local_fallback',
    'timestamp': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
    'repository': '${{ github.repository }}',
    'commit': '${{ github.sha }}',
    'status': 'api_token_missing',
    'files_analyzed': [
        'firmware/CollectorDeviceFirmware/CollectorDeviceFirmware.ino',
        'firmware/LineDeviceFirmware/LineDeviceFirmware.ino',
        'firmware/TuggerDeviceFirmware/TuggerFirmware.ino',
        'firmware/test-greptile-features.ino'
    ],
    'findings': [
        {
            'type': 'configuration_issue',
            'severity': 'high',
            'message': 'GREPTILE_API_TOKEN secret is not configured',
            'recommendation': 'Add GREPTILE_API_TOKEN to repository secrets',
            'files': ['all']
        }
    ]
}

with open('greptile-local-report.json', 'w') as f:
    json.dump(report, f, indent=2)

print('Local analysis report created: greptile-local-report.json')
"
        else
          echo "✅ GREPTILE_API_TOKEN found"
          echo "Token length: ${#GREPTILE_API_TOKEN}"
          echo "Token prefix: ${GREPTILE_API_TOKEN:0:10}..."
          
          # Try to make actual Greptile API call
          echo "=== ATTEMPTING GREPTILE API CALL ==="
          
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GREPTILE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @analysis_request.json \
            "https://api.greptile.com/v2/analyze")
          
          echo "=== API RESPONSE ==="
          echo "$response"
          
          # Save response
          echo "$response" > greptile-api-response.json
          
          # Create status report
          cat > greptile-status.json << 'EOF_STATUS'
{
  "analysis_type": "api_call_attempted",
  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
  "repository": "${{ github.repository }}",
  "commit": "${{ github.sha }}",
  "api_call_made": true,
  "response_received": true
}
EOF_STATUS
        fi
        
        echo "=== ANALYSIS COMPLETE ==="
        
    - name: Upload analysis artifacts
      uses: actions/upload-artifact@v4
      with:
        name: greptile-analysis-results
        path: |
          analysis_request.json
          greptile-local-report.json
          greptile-api-response.json
          greptile-status.json
