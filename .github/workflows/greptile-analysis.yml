name: Greptile Firmware Review

on:
  push:
    branches: [main, dev, dev-optimized-eink, 'claude/**']
    paths:
      - 'firmware/**'
      - '.github/workflows/greptile-analysis.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [main, dev, dev-optimized-eink]
    paths:
      - 'firmware/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  greptile-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Step 1: index the repo so Greptile has latest code
      - name: Index repository
        env:
          GREPTILE_API_TOKEN: ${{ secrets.GREPTILE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 .github/scripts/greptile_index.py

      # Step 2: query for a structured code review
      - name: Run code review query
        env:
          GREPTILE_API_TOKEN: ${{ secrets.GREPTILE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/greptile_query.py

      # Step 3a: post as PR comment
      - name: Post review as PR comment
        if: github.event_name == 'pull_request' && env.REVIEW_SUCCESS == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('greptile-review.md', 'utf8');
            const body = raw.length > 65000
              ? raw.substring(0, 65000) + '\n\n_[Truncated — download artifact for full report]_'
              : raw;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      # Step 3b: post as commit comment on push
      - name: Post review as commit comment
        if: github.event_name != 'pull_request' && env.REVIEW_SUCCESS == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('greptile-review.md', 'utf8');
            const body = raw.length > 65000
              ? raw.substring(0, 65000) + '\n\n_[Truncated — download artifact for full report]_'
              : raw;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

      # Step 4: always upload the full report as a downloadable artifact
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greptile-review-${{ github.sha }}
          path: greptile-review.md
          retention-days: 30
